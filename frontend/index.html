<!DOCTYPE html>
<html>
<head>
    <title>City AI Engine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🚦 City AI Engine Dashboard</h1>
    <p class="subtitle">AI-powered urban intelligence for smart cities</p>

    <div class="card">
        <h3>Traffic Prediction</h3>

        <input type="number" id="traffic" placeholder="Enter Traffic Count">
        <input type="number" id="rain" placeholder="Rain (0 = No, 1 = Yes)">

        <button onclick="predict()">Predict</button>

        <p class="result" id="result"></p>
    </div>

    <div class="card">
        <h3>Citizen Report Analysis</h3>

        <input type="text" id="report" placeholder="Enter report (e.g., traffic near station due to rain)">

        <button onclick="analyze()">Analyze</button>

        <p class="result" id="analysis"></p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
